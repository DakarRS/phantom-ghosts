services:
  web:
    build: .
    image: ghcr.io/dakarrs/phantom-ghosts:latest
    ports:
      - "${PORT:-8765}:8080"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/dakarrs/phantom-ghosts-server:latest
    environment:
      ROOMS: ${ROOMS:-Alpha,Bravo,Charlie,Delta}
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3
    command: http web:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    ports:
      - "4040:4040"
    depends_on:
      - web
    restart: unless-stopped
