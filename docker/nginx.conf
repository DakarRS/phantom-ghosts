server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers may cache but must revalidate, so a newly deployed image is picked up on the next load.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Game traffic goes to the Node server. Resolving at request time lets nginx start before it's up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $game http://server:3000;

    location /api/ {
        proxy_pass $game;
    }

    location /ws {
        proxy_pass $game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
