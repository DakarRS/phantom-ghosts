server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Files are bind-mounted from the host; disabling caching means a refresh always picks up edits.
    add_header Cache-Control "no-store" always;
    etag off;
    if_modified_since off;

    location / {
        try_files $uri $uri/ =404;
    }
}
